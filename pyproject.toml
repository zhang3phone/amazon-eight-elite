[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-eight-elite-local"
version = "0.2.0"
description = "Local-first Codex skill toolkit for Amazon operations"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1,<4"]

[project.scripts]
aee = "aee.cli:main"

[tool.setuptools]
packages = ["aee"]

[tool.setuptools.package-data]
aee = ["schema.sql"]
